name: Build Windows desktop app

on:
  push:
    branches: [main, master]
    paths:
      - 'electron/**'
      - 'build/icon.*'
      - 'electron-builder.yml'
      - 'prisma/schema.prisma'
      - 'prisma/schema.desktop.prisma'
      - 'prisma/seed.ts'
      - 'scripts/build-desktop.cjs'
      - 'scripts/electron-after-pack.cjs'
      - 'scripts/build-desktop-agent-workflows.cjs'
      - 'scripts/prepare-desktop-n8n.cjs'
      - 'vendor/windows-n8n/package.json'
      - 'vendor/windows-n8n/package-lock.json'
      - 'n8n/**'
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled n8n runtime
        run: npm run desktop:prepare-runtime

      # Full pipeline: SQLite client + next build + seeded template DB +
      # cafe-id meta + x64 NSIS installer. Windows runner
      # produces Windows Prisma engines — required for the package to work.
      - name: Build desktop installers
        run: node scripts/build-desktop.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cafe13-desktop-windows
          path: |
            dist-desktop/*.exe
          if-no-files-found: error
