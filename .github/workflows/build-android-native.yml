name: Build native Android app (offline-first)

on:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - 'src/app/api/sync/**'
      - 'src/lib/ledger/**'
      - 'src/lib/stock/**'
      - 'prisma/**'
      - '.github/workflows/build-android-native.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: 'true'

      - name: Core JVM tests (sync engine, no SDK needed)
        run: |
          cd android-app
          ./gradlew :core:test --no-daemon --stacktrace

      - name: App unit tests (Robolectric + MockWebServer)
        run: |
          cd android-app
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: |
          cd android-app
          ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: farman-native-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode upload keystore (if secrets provided)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/upload.keystore
            echo "ANDROID_KEYSTORE_PATH=/tmp/upload.keystore" >> $GITHUB_ENV
            echo "Keystore decoded from secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — release falls back to debug-signed (installable, not for Play Store)."
          fi

      - name: Build Release APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android-app
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: farman-native-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
