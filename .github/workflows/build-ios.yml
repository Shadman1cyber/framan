name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS (Release - unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/App/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            ios/App/build/Build/Products/Release-iphoneos/App.app \
            artifacts/Farman-iOS-unsigned.zip

      - name: Upload iOS build (Release)
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: artifacts/Farman-iOS-unsigned.zip
          if-no-files-found: error
