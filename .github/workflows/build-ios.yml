name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up CocoaPods
        run: sudo gem install cocoapods

      - name: Sync Capacitor (generates Podfile and plugin folders)
        run: npx cap sync ios

      - name: Build iOS app (archive, no code signing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package .app from archive
        run: |
          cd ios/App
          mkdir -p build/export
          cp -R build/App.xcarchive/Products/Applications/App.app build/export/

      - name: Create unsigned IPA
        run: |
          cd ios/App/build/export
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r FarmanCoffeeShop.ipa Payload
          rm -rf Payload

      - name: Upload IPA (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: ios/App/build/export/FarmanCoffeeShop.ipa