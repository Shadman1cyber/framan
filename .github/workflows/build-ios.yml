name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up CocoaPods
        run: sudo gem install cocoapods

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build iOS (Debug)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination generic/platform=iOS -quiet

      - name: Build iOS (Release - unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -quiet

      - name: Upload iOS build (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios/App/build/

      - name: Upload iOS build (Release)
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: ios/App/build/