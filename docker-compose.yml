services:
  # PostgreSQL replaces the old SQLite file. Data persists in pg-data volume.
  postgres:
    image: postgres:16-alpine
    container_name: farmans-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-farman}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-farman}
      - POSTGRES_DB=${POSTGRES_DB:-farman}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farman} -d ${POSTGRES_DB:-farman}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Redis cache for hot read paths (menu/catalog/order lists) under heavy load.
  redis:
    image: redis:7-alpine
    container_name: farmans-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: farmans-cafe
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farman}:${POSTGRES_PASSWORD:-farman}@postgres:5432/${POSTGRES_DB:-farman}?schema=public
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3080}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - PORT=${PORT:-3080}
      # QR codes point to this URL. Set it to your machine's LAN IP so phones
      # on the same network can open the menu, e.g. http://192.168.1.100:3080
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-zhipu}
      - AI_MODEL=${AI_MODEL:-glm-4}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      # Agent workspace (R11): flags flow into the app only.
      - AGENT_ENABLED=${AGENT_ENABLED:-false}
      - AGENT_WRITES_ENABLED=${AGENT_WRITES_ENABLED:-false}
      - AGENT_SHADOW_MODE=${AGENT_SHADOW_MODE:-false}
      - AGENT_CANARY_USERS=${AGENT_CANARY_USERS:-}
      - AGENT_WORKSPACE=${AGENT_WORKSPACE:-false}
      - AGENT_CAFE_ID=${AGENT_CAFE_ID:-}
      - AGENT_ENGINE=${AGENT_ENGINE:-legacy}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/farman-agent
      - GRAPH_MAX_STALE_SECONDS=${GRAPH_MAX_STALE_SECONDS:-300}
      # OpenObserve OTLP endpoint INSIDE the Compose network (R10).
      - OPENOBSERVE_TRACES_URL=${OPENOBSERVE_TRACES_URL:-http://openobserve:5080/api/default/v1/traces}
      - OPENOBSERVE_AUTHORIZATION=${OPENOBSERVE_AUTHORIZATION:-}
      - OPENOBSERVE_INTERNAL_HOST=openobserve
      - OPENOBSERVE_DASHBOARD_URL=${OPENOBSERVE_DASHBOARD_URL:-http://localhost:5080}
    volumes:
      - uploads:/app/uploads
    env_file:
      - path: .env.n8n.bridge
        required: false
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openobserve:
        condition: service_started

  worker:
    build: .
    container_name: farmans-agent-worker
    command: node worker/dist.cjs
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farman}:${POSTGRES_PASSWORD:-farman}@postgres:5432/${POSTGRES_DB:-farman}?schema=public
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - AGENT_ENABLED=${AGENT_ENABLED:-false}
      - AGENT_WRITES_ENABLED=${AGENT_WRITES_ENABLED:-false}
      - AGENT_WORKSPACE=${AGENT_WORKSPACE:-false}
      - AGENT_CAFE_ID=${AGENT_CAFE_ID:-}
      - AGENT_ENGINE=${AGENT_ENGINE:-legacy}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/farman-agent
      - GRAPH_MAX_STALE_SECONDS=${GRAPH_MAX_STALE_SECONDS:-300}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_MODEL=${AI_MODEL:-glm-4}
      - OPENOBSERVE_TRACES_URL=${OPENOBSERVE_TRACES_URL:-http://openobserve:5080/api/default/v1/traces}
      - OPENOBSERVE_AUTHORIZATION=${OPENOBSERVE_AUTHORIZATION:-}
      - OPENOBSERVE_INTERNAL_HOST=openobserve
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-}
    restart: unless-stopped
    env_file:
      - path: .env.n8n.bridge
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  # Local OpenObserve (R10): telemetry UI on 127.0.0.1:5080 only; credentials
  # come from server-side env (OPENOBSERVE_* / ZO_ROOT_USER_*), never baked in.
  openobserve:
    # Pinned: v0.92.2 verified (2026-09-10). Fresh spans are queryable only with
    # ZO_QUERY_ON_WAL=true; search API: /api/{org}/_search_stream?type=traces.
    image: public.ecr.aws/zinclabs/openobserve:v0.92.2
    container_name: farmans-openobserve
    ports:
      - "${OPENOBSERVE_BIND_ADDRESS:-127.0.0.1}:5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-owner@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-}
      - ZO_QUERY_ON_WAL=true
      - ZO_DATA_DIR=/data
      - ZO_HTTP_PORT=5080
    volumes:
      - openobserve-data:/data
    restart: unless-stopped

  # n8n orchestrates model workflows only. Business tools and approval remain
  # inside FARMAN; its own metadata lives in a separate database and volume.
  n8n-db:
    image: postgres:16-alpine
    container_name: farmans-n8n-db
    env_file:
      - path: .env.n8n-db
        required: false
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_DB=n8n
    volumes:
      - n8n-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.40.0
    container_name: farmans-n8n
    # Docker Desktop DNS intermittently returns EAI_AGAIN for the model host.
    # Override this verified address via N8N_MODEL_HOST_IP if the provider rotates it.
    extra_hosts:
      - "open.bigmodel.cn:${N8N_MODEL_HOST_IP:-47.254.134.77}"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - path: .env.n8n
        required: false
      - path: .env.n8n.bridge
        required: false
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - GENERIC_TIMEZONE=Asia/Tehran
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  uploads:
  openobserve-data:
  n8n-pg-data:
  n8n-data:
